{% if questions %}
<div class="list-group">
  {% for question in questions %}
  <div class="list-group-item d-flex justify-content-between align-items-start">
    <div>
      <div class="fw-medium">{{ forloop.counter }}. {{ question.question_text }}</div>
      <div class="text-muted small">{{ question.get_question_type_display }}</div>
    </div>
    <form method="post" action="{% url 'courses:question_delete' question.id %}" onsubmit="return confirm('Delete this question?');">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
    </form>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="text-muted">No questions yet.</div>
{% endif %}
