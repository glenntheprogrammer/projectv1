      </div>
    </div>
  </div>

  <div class="col-sm-6 col-lg-3">

        <div class="d-flex align-items-center">

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const labels = {{ chart_labels|safe }};

  document.querySelectorAll('.student-sparkline').forEach(function (canvas) {
    const data = JSON.parse(canvas.dataset.present);

    new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            data: data,
            borderColor: '#2fb344',
            backgroundColor: 'transparent',
            spanGaps: true,
            tension: 0.4,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
        },
        scales: {
          x: { display: false },
          y: { display: false, min: -0.2, max: 1.2 },
        },
      },
    });
  });
});
</script>
{% endblock %}
